# Hey Ann on Megatron (k3s). Runbook: docs/DEPLOY.md.
#   :8080 ui   UI + API + live events + owner login (password, remembered per device). tailscale serve svc:heyann -> https://heyann.tailf67d61.ts.net (tailnet only)
#   :8081 mcp  /mcp (Orbit Identity OAuth) + /.well-known/oauth-protected-resource only. cloudflared ->
#              https://heyann-mcp.karthiksurkanti.in (path-filtered to exactly those paths); the Orbit Hub (namespace hub)
#              also calls it in-cluster on the ClusterIP with the same tokens.
# Value to replace before applying:
#   IMAGE_DIGEST    the digest deploy/import-image.sh printed
# Provisioned separately, never in this file:
#   Secret    heyann-owner   key "verifier" (npm run password, or Orbit.Credentials; a password of its own)
#   ConfigMap heyann-jwks    key "jwks.json": Orbit Identity's public keys (curl https://auth.karthiksurkanti.in/.well-known/jwks)
apiVersion: v1
kind: Namespace
metadata:
  name: heyann
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heyann
  namespace: heyann
# Hey Ann never talks to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heyann-data
  namespace: heyann
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heyann
  namespace: heyann
spec:
  # SQLite on a ReadWriteOnce volume: exactly one writer, and the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 180
  selector:
    matchLabels: { app: heyann }
  template:
    metadata:
      labels: { app: heyann }
    spec:
      serviceAccountName: heyann
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: heyann
          image: ghcr.io/kar6677thik/hey-ann@sha256:IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: ui, containerPort: 8080 }
            - { name: mcp, containerPort: 8081 }
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8080" }
            - { name: HEYANN_DATA, value: /data }
            # Dates ("friday", "tomorrow 5pm") resolve in this zone until it is changed in Settings.
            - { name: HEYANN_TIMEZONE, value: "Asia/Kolkata" }
            # UI: exact Host allow-list (plus localhost for probes), unsafe requests must come from this origin.
            - { name: HEYANN_PUBLIC_ORIGIN, value: "https://heyann.tailf67d61.ts.net" }
            # tailscale serve and cloudflared both run on the node and reach the pod from its cni0 address.
            - { name: HEYANN_TRUSTED_PROXY, value: "10.42.0.1" }
            - { name: HEYANN_CREDENTIAL_FILE, value: /run/heyann/owner/verifier }
            # MCP: its own listener, Orbit Identity access tokens only (RFC 9068, ES256), owner subject only.
            - { name: HEYANN_MCP_PORT, value: "8081" }
            # MCP listener only: the node (cloudflared) plus the pod network, so the Orbit Hub's X-Forwarded-Proto counts.
            # Safe only because the NetworkPolicy below admits nothing else from the pod network to 8081.
            - { name: HEYANN_MCP_TRUSTED_PROXY, value: "10.42.0.1,10.42.0.0/16" }
            - { name: HEYANN_MCP_PUBLIC_ORIGIN, value: "https://heyann-mcp.karthiksurkanti.in" }
            - { name: HEYANN_MCP_ALLOWED_ORIGINS, value: "https://claude.ai" }
            - { name: HEYANN_OAUTH_ISSUER, value: "https://auth.karthiksurkanti.in/" }
            - { name: HEYANN_OAUTH_RESOURCE, value: "https://heyann-mcp.karthiksurkanti.in/mcp" }
            # Orbit Identity's owner subject (an identifier, not a secret).
            - { name: HEYANN_OAUTH_ALLOWED_SUBJECTS, value: "7356e980-f25e-4c82-84f1-b00c5f9783f0" }
            - { name: HEYANN_OAUTH_JWKS_FILE, value: /run/heyann/jwks/jwks.json }
          resources:
            # One Node process and SQLite; a personal board stays small.
            requests: { cpu: 25m, memory: 96Mi, ephemeral-storage: 16Mi }
            limits: { cpu: "1", memory: 384Mi, ephemeral-storage: 256Mi }
          startupProbe:
            httpGet: { path: /health/ready, port: ui, httpHeaders: [{ name: Host, value: localhost }] }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: ui, httpHeaders: [{ name: Host, value: localhost }] }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: ui, httpHeaders: [{ name: Host, value: localhost }] }
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: owner, mountPath: /run/heyann/owner, readOnly: true }
            - { name: jwks, mountPath: /run/heyann/jwks, readOnly: true }
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: heyann-data }
        - name: owner
          secret: { secretName: heyann-owner, defaultMode: 0440 }
        - name: jwks
          configMap: { name: heyann-jwks, defaultMode: 0444 }
        # Database exports are written here; disk-backed so they don't count against memory.
        - name: temporary
          emptyDir: { sizeLimit: 128Mi }
---
# A fixed ClusterIP so tailscale serve and cloudflared can point at it. Taken when written: .100 Orbit, .101 Identity,
# .102 Sprawl, .103 VictoriaMetrics, .104 DELPHI, .105 Socrates. Re-check before applying: kubectl get svc -A -o wide | grep '10.43.0.10'
apiVersion: v1
kind: Service
metadata:
  name: heyann
  namespace: heyann
spec:
  type: ClusterIP
  clusterIP: 10.43.0.106
  selector: { app: heyann }
  ports:
    - { name: ui, port: 8080, targetPort: ui }
    - { name: mcp, port: 8081, targetPort: mcp }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: heyann
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Policies see post-kube-proxy addresses: tailscale serve, cloudflared and kubelet probes all arrive from the node's
# cni0 address. No egress at all (Egress is listed in policyTypes with no egress rules): the JWKS is a mounted file
# and Hey Ann never calls out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: heyann
  namespace: heyann
spec:
  podSelector:
    matchLabels: { app: heyann }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.42.0.1/32 }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
    # The Orbit Hub pod, MCP listener only.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: hub } }
          podSelector: { matchLabels: { app.kubernetes.io/name: orbit-hub } }
      ports:
        - { protocol: TCP, port: 8081 }
