<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151517" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Hey Ann: your personal Kanban board, run from Claude and ChatGPT." />
    <title>Hey Ann</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151517'/%3E%3Crect x='7' y='8' width='4.5' height='16' rx='1.5' fill='%234a8ad6'/%3E%3Crect x='13.75' y='8' width='4.5' height='11' rx='1.5' fill='%23f2f2f3'/%3E%3Crect x='20.5' y='8' width='4.5' height='7' rx='1.5' fill='%23f2f2f3' fill-opacity='.55'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint (no flash). Dark is the default.
      try {
        var t = localStorage.getItem('heyann:theme');
        var light = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Hey Ann needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
